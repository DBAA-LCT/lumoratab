name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Run project validation tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          node --test tests/core.test.js

      - name: Build unsigned release packages
        run: python build-release.py

      - name: Verify reproducible ZIP packages
        shell: bash
        run: |
          sha256sum dist/*.zip > "$RUNNER_TEMP/first-build.sha256"
          python build-release.py
          sha256sum --check "$RUNNER_TEMP/first-build.sha256"

      - name: Verify package contents
        shell: bash
        run: |
          version="$(python -c "import json; print(json.load(open('manifest.json', encoding='utf-8'))['version'])")"
          unzip -t "dist/lumoratab-chrome-v$version.zip"
          unzip -t "dist/lumoratab-edge-v$version.zip"
          unzip -t "dist/lumoratab-store-v$version.zip"
