name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to update
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Run project validation tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          node --test tests/core.test.js

      - name: Verify release tag matches manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(python -c "import json; print(json.load(open('manifest.json', encoding='utf-8'))['version'])")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match manifest version v$version" >&2
            exit 1
          fi

      - name: Restore CRX signing key
        shell: bash
        env:
          CRX_PRIVATE_KEY_B64: ${{ secrets.CRX_PRIVATE_KEY_B64 }}
        run: |
          if [[ -z "$CRX_PRIVATE_KEY_B64" ]]; then
            echo "CRX_PRIVATE_KEY_B64 secret is missing" >&2
            exit 1
          fi
          printf '%s' "$CRX_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/lumoratab.pem"
          chmod 600 "$RUNNER_TEMP/lumoratab.pem"

      - name: Build ZIP and signed CRX packages
        run: python build-release.py --crx-key "$RUNNER_TEMP/lumoratab.pem" --require-crx

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(python -c "import json; print(json.load(open('manifest.json', encoding='utf-8'))['version'])")"
          tag="$RELEASE_TAG"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "LumoraTab $tag" --generate-notes
          fi
          gh release upload "$tag" \
            "dist/lumoratab-chrome-v$version.zip#Chrome unpacked package" \
            "dist/lumoratab-edge-v$version.zip#Edge unpacked package" \
            "dist/lumoratab-store-v$version.zip#Browser store submission package" \
            "dist/lumoratab-v$version.crx#Signed CRX3 package" \
            "dist/SHA256SUMS.txt#SHA256 checksums" \
            --clobber
